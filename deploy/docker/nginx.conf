# Static host and reverse proxy for the two web apps. Replaces nginx's stock
# /etc/nginx/conf.d/default.conf in the image built from Dockerfile.web.
#
# One file for both apps: they differ only in which bundle was copied into
# /usr/share/nginx/html, and everything below is identical.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The single most important line here, and the easiest to leave out.
    #
    # nginx's default cap is 1m, and it is enforced by the proxy BEFORE any Go
    # timeout gets a chance to run: a 10MiB upload is rejected with a 413 by a
    # component that never appears in the API contract. UPLOAD_MAX_FILE_SIZE is
    # 10MiB, so 12m leaves room for multipart framing. Raise this and
    # UPLOAD_MAX_FILE_SIZE together or not at all.
    client_max_body_size 12m;

    # index.html is the one file that must never be cached. Umi emits
    # content-hashed asset names, so a client holding yesterday's HTML asks for
    # asset names that this deploy has already deleted -- and gets a blank page
    # rather than an error anyone can act on.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Hashed assets are immutable by construction: the name changes when the
    # content does.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpe?g|gif|ico|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Everything the apps call lives under one of two prefixes, and both go to
    # the gateway. The name below is the compose service name; if the gateway
    # moves behind a separate load balancer, this is the one line that changes
    # (or turn the file into an envsubst template, which the nginx image
    # processes from /etc/nginx/templates/).
    #
    # These settings sit at server level rather than inside each location
    # because /v1/ and /api/ must not drift apart -- a timeout fixed in one and
    # forgotten in the other is the kind of difference nobody notices until an
    # upload starts failing on one prefix only. They only take effect where a
    # proxy_pass exists, so the static locations below are unaffected.
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Must stay ABOVE GATEWAY_UPLOAD_TIMEOUT_MS (120s). This is the outer of the
    # two budgets and the slower request is an upload: set it below the
    # gateway's own timeout and nginx abandons an upload the gateway is still
    # completing, turning a working request into a 504.
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
    proxy_connect_timeout 10s;

    # Request buffering stays on (the default): nginx spools the whole body
    # before opening the upstream connection, so a slow client cannot pin a
    # gateway connection for the length of its upload. That is also why
    # client_max_body_size has to be correct -- it is the only size check that
    # happens before the body reaches the gateway.

    location /v1/ {
        proxy_pass http://gateway-service:8080;
    }

    # The second prefix, and the one that is easy to leave out: the front-ends
    # request `/api/v1/...`, not `/v1/...` (see the dev `proxy` in each app's
    # .umirc.ts). Without this location those requests fall through to the SPA
    # fallback below and come back as index.html with a 200 -- the apps get HTML
    # where they expect JSON, and the first deploy is a site that loads and then
    # does nothing. In dev the umi proxy hides the gap by rewriting `^/api`
    # away; nothing in this file did.
    #
    # No rewrite here on purpose. The gateway strips the prefix itself
    # (gateway-service/internal/proxy normalizePath), which is what that
    # function exists for. Adding `proxy_pass .../;` would strip it a second
    # time in nginx and work just as well -- but then the two prefixes behave
    # differently, and only one of them is covered by the gateway's own tests.
    location /api/ {
        proxy_pass http://gateway-service:8080;
    }

    # SPA fallback. Deep links like /merchants/42 are client-side routes with no
    # file behind them; without this, a refresh on any page except / is a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Forwarding X-Forwarded-For is only half the job: the gateway ignores it
# unless it trusts this proxy. Set TRUSTED_PROXY_CIDRS to this container's
# network, or every request arrives keyed on nginx's address and the whole site
# shares one rate-limit bucket -- everyone gets 429 together, and the limit
# stops being a limit. See the note in deploy/config/.env.example.
