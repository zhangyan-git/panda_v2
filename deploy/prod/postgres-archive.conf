# Point-in-time recovery settings for the panda PostgreSQL instance.
#
# Include this from postgresql.conf:
#
#     include 'postgres-archive.conf'
#
# or drop it in as conf.d/postgres-archive.conf if the image reads that
# directory. The parent of the path must be writable by postgres, and
# PostgreSQL 12+ refuses to follow an include out of the data directory if the
# file's permissions allow group or world write.
#
# Both settings below need a full restart -- archive_mode is read once at
# startup, so a reload leaves the WAL archive silently off while pg_settings
# reports the value you just set.

# Record enough WAL to support archiving and replication. The default in PG 16
# is already replica, but it is written out because it is a prerequisite for
# archive_mode: this file is the one place that says what the cluster is
# supposed to be doing.
wal_level = replica

# Copy every completed segment through the script below.
archive_mode = on

# Postgres retries a segment until this command exits zero, and only recycles
# WAL that has been archived. A command that fails permanently does not lose
# data -- it fills pg_wal until the instance stops accepting writes. That is the
# intended failure direction, but it means this must be monitored: see the
# pg_stat_archiver queries in README.md. A full disk is the symptom of an
# archive that has been broken for days, not a disk that is too small.
archive_command = '/opt/panda/archive-wal.sh %p %f'

# Force a segment switch after this long even if it is not full. Without it, a
# quiet database can leave the most recent changes sitting unfilled in pg_wal
# for hours, and the newest recoverable point is correspondingly stale.
archive_timeout = 300
