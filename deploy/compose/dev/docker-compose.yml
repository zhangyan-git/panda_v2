services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-panda_identity}
      POSTGRES_USER: ${POSTGRES_USER:-panda}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-replace-me}
    ports: ["5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs once, on a fresh volume only: creates the merchant database.
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-user}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-replace-me}
    ports: ["5672:5672", "15672:15672"]
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  etcd:
    image: quay.io/coreos/etcd:v3.5.15
    command: ["/usr/local/bin/etcd", "--name=etcd0", "--advertise-client-urls=http://0.0.0.0:2379", "--listen-client-urls=http://0.0.0.0:2379"]
    ports: ["2379:2379"]
    volumes:
      - etcd-data:/etcd-data
    healthcheck:
      test: ["CMD", "/usr/local/bin/etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 10

  opensearch:
    image: opensearchproject/opensearch:2.15.0
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: ${OPENSEARCH_JAVA_OPTS:--Xms512m -Xmx512m}
    ports: ["9200:9200", "9600:9600"]
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 20

  tempo:
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    ports: ["3200:3200"]
    volumes:
      - ../../observability/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3200/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:v2.54.1
    ports: ["9090:9090"]
    volumes:
      - ../../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.103.1
    volumes: ["../../observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro"]
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    ports: ["4317:4317", "4318:4318", "8889:8889", "13133:13133"]
    depends_on:
      opensearch:
        condition: service_healthy
      tempo:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "validate", "--config=/etc/otelcol-contrib/config.yaml"]
      interval: 10s
      timeout: 5s
      retries: 10

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-replace-me}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    ports: ["3000:3000"]
    volumes:
      - grafana-data:/var/lib/grafana
      - ../../observability/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      opensearch:
        condition: service_healthy
      tempo:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # Applications.
  #
  # Behind a profile, so `docker compose up` still starts only the middleware --
  # which is what day-to-day development wants, with the services running under
  # `go run` on the host. Bring up the containerised stack with:
  #
  #     docker compose --profile app up --build
  #
  # Every address below is a compose service name, not localhost: the repo's
  # .env is written for services running on the host, so the in-network values
  # are overridden here rather than edited there.
  #
  # Note for anyone adding a healthcheck: the Go images are distroless and have
  # no shell, so CMD-SHELL cannot run. Health is the load balancer's job via
  # /livez and /readyz on the HTTP port.
  # ---------------------------------------------------------------------------

  user-service:
    profiles: ["app"]
    build:
      context: ../../..
      dockerfile: deploy/docker/Dockerfile.backend
      args:
        SERVICE: user-service
        # gateway-service keeps its main package in cmd/gateway; this one does not.
        CMD: ./cmd
    env_file: ["../../../.env"]
    environment:
      PANDA_ENV: dev
      SERVICE_NAME: user-service
      HTTP_ADDR: ":8080"
      GRPC_ADDR: ":9090"
      USER_DATABASE_URL: postgres://${POSTGRES_USER:-panda}:${POSTGRES_PASSWORD:-replace-me}@postgres:5432/panda_identity?sslmode=disable
      MERCHANT_GRPC_ADDR: merchant-service:9090
      REDIS_ADDR: redis:6379
      REGISTRY_ENDPOINT: http://etcd:2379
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      # Migrations are embedded in the binary; see the Dockerfile. Off by
      # default here to match how production deploys them.
      DB_MIGRATE_ON_START: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      etcd:
        condition: service_healthy

  merchant-service:
    profiles: ["app"]
    build:
      context: ../../..
      dockerfile: deploy/docker/Dockerfile.backend
      args:
        SERVICE: merchant-service
        CMD: ./cmd
    env_file: ["../../../.env"]
    environment:
      PANDA_ENV: dev
      SERVICE_NAME: merchant-service
      HTTP_ADDR: ":8080"
      GRPC_ADDR: ":9090"
      MERCHANT_DATABASE_URL: postgres://${POSTGRES_USER:-panda}:${POSTGRES_PASSWORD:-replace-me}@postgres:5432/panda_merchant?sslmode=disable
      USER_GRPC_ADDR: user-service:9090
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-user}:${RABBITMQ_PASSWORD:-replace-me}@rabbitmq:5672/
      REGISTRY_ENDPOINT: http://etcd:2379
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      DB_MIGRATE_ON_START: "false"
      # Deliberately no REDIS_ADDR: this service does not use Redis, and NOT
      # setting it is what keeps a Redis outage from taking the merchant domain
      # down with it.
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      etcd:
        condition: service_healthy

  gateway-service:
    profiles: ["app"]
    build:
      context: ../../..
      dockerfile: deploy/docker/Dockerfile.backend
      args:
        SERVICE: gateway-service
        CMD: ./cmd/gateway
    env_file: ["../../../.env"]
    environment:
      PANDA_ENV: dev
      SERVICE_NAME: gateway-service
      GATEWAY_ADDR: ":8080"
      USER_SERVICE_URL: http://user-service:8080
      MERCHANT_SERVICE_URL: http://merchant-service:8080
      REGISTRY_ENDPOINT: http://etcd:2379
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      # Without this the gateway keys rate limits on nginx's container address,
      # so every user shares one bucket and they all get 429 together. This
      # range is the docker bridge space -- correct for a dev stack where every
      # peer is a container, and far too wide anywhere else.
      TRUSTED_PROXY_CIDRS: 172.16.0.0/12
    ports: ["8080:8080"]
    depends_on:
      etcd:
        condition: service_healthy

  admin-web:
    profiles: ["app"]
    build:
      context: ../../..
      dockerfile: deploy/docker/Dockerfile.web
      args:
        APP: admin-web
    ports: ["8000:80"]
    depends_on:
      - gateway-service
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  merchant-web:
    profiles: ["app"]
    build:
      context: ../../..
      dockerfile: deploy/docker/Dockerfile.web
      args:
        APP: merchant-web
    ports: ["8001:80"]
    depends_on:
      - gateway-service
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  etcd-data:
  opensearch-data:
  tempo-data:
  prometheus-data:
  grafana-data:
