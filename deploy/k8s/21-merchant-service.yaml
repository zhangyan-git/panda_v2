# 商户与门店域。商户、品牌、门店三张主数据表，以及挂在它们下面的数据范围授权。
# 它也是**唯一**用 OSS 的服务：营业执照等图片的上传走这里。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: merchant-service
  namespace: pandaaaa
  labels:
    app.kubernetes.io/name: merchant-service
    app.kubernetes.io/part-of: panda-v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: merchant-service
  template:
    metadata:
      labels:
        app: merchant-service
        app.kubernetes.io/version: "bb2c1d7"
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: merchant-service
          image: 192.168.18.75:30500/pandaaaa/merchant-service:bb2c1d7d1f7a426ec3ec84eaf08a10c13a3e4143
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 9090
          envFrom:
            - configMapRef:
                name: panda-common
          env:
            # 链路里的 service.version。**取的是 Pod 标签，不是写死的字符串** ——
            # 写死的那个值和镜像 tag 是两个地方，迟早有一个过期，
            # 而过期的版本号比没有版本号更糟：它会让你相信链路看到的是对的。
            # 换版本时改上面的 image tag 和下面的 version 标签，两处都在这个文件里。
            - name: SERVICE_VERSION
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['app.kubernetes.io/version']
            - name: SERVICE_NAME
              value: merchant-service
            - name: HTTP_ADDR
              value: ":8080"
            - name: GRPC_ADDR
              value: ":9090"
            - name: MERCHANT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: panda-secret
                  key: MERCHANT_DATABASE_URL
            # 建商户要落一个负责人账号，所以要问用户服务。
            - name: USER_GRPC_ADDR
              value: user-service:9090
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: panda-secret
                  key: RABBITMQ_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: panda-secret
                  key: JWT_SECRET
            - name: MERCHANT_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: panda-secret
                  key: MERCHANT_INTERNAL_TOKEN
            # **刻意不设 REDIS_ADDR**：这个服务不用 Redis。设上一个连不上的地址是
            # 启动失败，而不是「少了缓存」——那样 Redis 抖一下会连商户域一起带走。
            - name: OSS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: panda-secret
                  key: OSS_ACCESS_KEY
            - name: OSS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: panda-secret
                  key: OSS_SECRET_KEY
            - name: OSS_ENDPOINT
              value: oss-cn-hangzhou.aliyuncs.com
            - name: OSS_BUCKET
              valueFrom:
                secretKeyRef:
                  name: panda-secret
                  key: OSS_BUCKET
            - name: UPLOAD_PATH
              value: panda-v2
            # 10MiB。前端 nginx 的 client_max_body_size 是 12m（留了 multipart 的余量），
            # 两者要一起改。
            - name: UPLOAD_MAX_FILE_SIZE
              value: "10485760"
            - name: DB_MIGRATE_ON_START
              value: "false"
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 400m
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: merchant-service
  namespace: pandaaaa
spec:
  selector:
    app: merchant-service
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: grpc
      port: 9090
      targetPort: grpc
