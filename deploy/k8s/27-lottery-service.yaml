# 抽奖域：活动、奖池、参与记录、开奖。
# 一次参与当场扣一张福卡，所以账户域是硬依赖；抽奖库只存门店 id，
# 开通前要问商户域「这家店存在吗」，读列表时还要解一页门店名 —— 商户域也是硬依赖。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lottery-service
  namespace: pandaaaa
  labels:
    app.kubernetes.io/name: lottery-service
    app.kubernetes.io/part-of: panda-v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lottery-service
  template:
    metadata:
      labels:
        app: lottery-service
        app.kubernetes.io/version: "ae557f0"
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: lottery-service
          image: 192.168.18.75:30500/pandaaaa/lottery-service:ae557f024e9dc815df77f5183d5bd0db1f2c9be9
          ports:
            - name: http
              containerPort: 8080
            # **这个服务不暴露 grpc 端口**：本轮它没有入向 gRPC
            # （内部调用方一个都没有，开奖在进程内），只有出向的账户调用和
            # 给控制台/小程序的 HTTP。所以这里也不建 grpc Service 端口。
          envFrom:
            - configMapRef:
                name: panda-common
          env:
            # 链路里的 service.version。**取的是 Pod 标签，不是写死的字符串** ——
            # 写死的那个值和镜像 tag 是两个地方，迟早有一个过期，
            # 而过期的版本号比没有版本号更糟：它会让你相信链路看到的是对的。
            # 换版本时改上面的 image tag 和下面的 version 标签，两处都在这个文件里。
            - name: SERVICE_VERSION
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['app.kubernetes.io/version']
            - name: SERVICE_NAME
              value: lottery-service
            - name: HTTP_ADDR
              value: ":8080"
            # 刻意不设 GRPC_ADDR：见上面 ports 的说明。
            - name: LOTTERY_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: panda-secret
                  key: LOTTERY_DATABASE_URL
            # 三个都是 config 里必填：少任何一个都拒绝启动。
            - name: ACCOUNT_GRPC_ADDR
              value: account-service:9090
            - name: USER_GRPC_ADDR
              value: user-service:9090
            - name: MERCHANT_GRPC_ADDR
              value: merchant-service:9090
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: panda-secret
                  key: RABBITMQ_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: panda-secret
                  key: JWT_SECRET
            - name: MERCHANT_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: panda-secret
                  key: MERCHANT_INTERNAL_TOKEN
            - name: DB_MIGRATE_ON_START
              value: "false"
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 400m
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: lottery-service
  namespace: pandaaaa
spec:
  selector:
    app: lottery-service
  ports:
    - name: http
      port: 8080
      targetPort: http
