# 订单域：下单、订单行、售后（退款申请与审核）。四个下游都是 config 里必填的，
# 少任何一个都是拒绝启动，不是一个降级模式。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: pandaaaa
  labels:
    app.kubernetes.io/name: order-service
    app.kubernetes.io/part-of: panda-v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
        app.kubernetes.io/version: "ae557f0"
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: order-service
          image: registry.dev.51qituan.com/pandaaaa/order-service:ae557f024e9dc815df77f5183d5bd0db1f2c9be9
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 9090
          envFrom:
            - configMapRef:
                name: panda-common
          env:
            # 链路里的 service.version。**取的是 Pod 标签，不是写死的字符串** ——
            # 写死的那个值和镜像 tag 是两个地方，迟早有一个过期，
            # 而过期的版本号比没有版本号更糟：它会让你相信链路看到的是对的。
            # 换版本时改上面的 image tag 和下面的 version 标签，两处都在这个文件里。
            - name: SERVICE_VERSION
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['app.kubernetes.io/version']
            - name: SERVICE_NAME
              value: order-service
            - name: HTTP_ADDR
              value: ":8080"
            - name: GRPC_ADDR
              value: ":9090"
            - name: ORDER_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: panda-secret
                  key: ORDER_DATABASE_URL
            # 四个必填下游：下单要问设备事实、发起支付要把权威金额交给支付域、
            # 下单与售后都要问用户身份、受理退款前还要问账户域「这一单赠送的福卡
            # 还冻得上吗」。account 那一条尤其不能少 —— 它是「福卡没用过才许退」
            # 这条业务规则的判据所在。
            - name: USER_GRPC_ADDR
              value: user-service:9090
            - name: COFFEE_MACHINE_GRPC_ADDR
              value: coffee-machine-service:9090
            - name: PAYMENT_GRPC_ADDR
              value: payment-service:9090
            - name: ACCOUNT_GRPC_ADDR
              value: account-service:9090
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: panda-secret
                  key: RABBITMQ_URL
            # 队列名与路由键**不能沿用审计队列的值**。照抄的后果有两个且都不报错：
            # 审计事件被两个消费者对半分；以及 payment.succeeded 根本不会投过来，
            # 订单永远停在待支付。
            #
            # 两个键而不是一个 "payment.*"：topic 交换机里 * 匹配**恰好一段**，
            # "payment.*" 收得到 payment.succeeded（两段），收不到
            # payment.refund.succeeded（三段）。漏绑的表现仍然是发布方报成功、
            # 消息静默丢弃 —— 订单永远停在 refunding，而两边日志都干净。
            #
            # 收窄成 "payment.*,payment.refund.*" 而不是放宽成 "payment.#"：
            # 后者会把将来每一条两段、四段、五段的 payment 事件都收进来，只为被 ack 掉。
            #
            # 路由键是**队列声明参数**（DLX 的 x-dead-letter-routing-key 取的就是
            # 这一串原文），已存在的 order.payment.dev 无法被重新声明。
            # 改这一行要先手工删旧队列，否则 DeclareQueue 回 PRECONDITION_FAILED，
            # 表现出来是「连不上 RabbitMQ」——别照那个方向去查 broker。
            - name: RABBITMQ_QUEUE
              value: order.payment.dev
            - name: RABBITMQ_ROUTING_KEY
              value: "payment.*,payment.refund.*"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: panda-secret
                  key: JWT_SECRET
            - name: MERCHANT_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: panda-secret
                  key: MERCHANT_INTERNAL_TOKEN
            - name: DB_MIGRATE_ON_START
              value: "false"
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 400m
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: pandaaaa
spec:
  selector:
    app: order-service
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: grpc
      port: 9090
      targetPort: grpc
