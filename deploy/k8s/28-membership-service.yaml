# 会员域：会员等级、会员权益、订阅（连续包月/年度）、活动。
# 续费那笔账记在订单域 —— 一期代扣成功之后先建一张续费单，再回本库续这一期。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: membership-service
  namespace: pandaaaa
  labels:
    app.kubernetes.io/name: membership-service
    app.kubernetes.io/part-of: panda-v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: membership-service
  template:
    metadata:
      labels:
        app: membership-service
        app.kubernetes.io/version: "bb2c1d7"
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: membership-service
          image: 192.168.18.75:30500/pandaaaa/membership-service:bb2c1d7d1f7a426ec3ec84eaf08a10c13a3e4143
          ports:
            - name: http
              containerPort: 8080
            # 有入向 gRPC：order-service 下单买会员时问它要套餐的价格与时长，
            # 下单那一单的价格只能由这一份回答决定。
            - name: grpc
              containerPort: 9090
          envFrom:
            - configMapRef:
                name: panda-common
          env:
            # 链路里的 service.version。**取的是 Pod 标签，不是写死的字符串** ——
            # 写死的那个值和镜像 tag 是两个地方，迟早有一个过期，
            # 而过期的版本号比没有版本号更糟：它会让你相信链路看到的是对的。
            # 换版本时改上面的 image tag 和下面的 version 标签，两处都在这个文件里。
            - name: SERVICE_VERSION
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['app.kubernetes.io/version']
            - name: SERVICE_NAME
              value: membership-service
            - name: HTTP_ADDR
              value: ":8080"
            - name: GRPC_ADDR
              value: ":9090"
            - name: MEMBERSHIP_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: panda-secret
                  key: MEMBERSHIP_DATABASE_URL
            # 四个都是 config 里的**必填项**：缺一条不是「某一类请求 5xx」，
            # 而是容器根本起不来。
            #   USER       —— 后台每条会员路由都要现取一次授权，问不到就 fail-closed。
            #   MERCHANT   —— 开通前要问「这家店在不在」，以及会员价权益那条只读 RPC。
            #   PAYMENT    —— 连续包月的签约、查约、扣款、解约四个动作都在支付域。
            #   ORDER      —— 一期代扣成功之后先建一张续费单，下游才拿得到订单号发会员价券。
            - name: USER_GRPC_ADDR
              value: user-service:9090
            - name: MERCHANT_GRPC_ADDR
              value: merchant-service:9090
            - name: PAYMENT_GRPC_ADDR
              value: payment-service:9090
            - name: ORDER_GRPC_ADDR
              value: order-service:9090
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: panda-secret
                  key: RABBITMQ_URL
            # 队列名与路由键**不能沿用审计队列的值**：照抄的后果是审计事件被两个
            # 消费者对半分，而 order.paid 根本不会投过来，于是「付了钱没有会员」。
            #
            # 四条 payment 键都是**三段**（payment.agreement.signed）：
            # "payment.*" 那个通配只匹配恰好一段，写成它等于四条都没绑上 ——
            # 而绑不上不会报错，症状分别是「用户签了约、后台那条订阅永远停在待签约」
            # （协议那两条），以及「钱扣了、会员没续，或者连着扣不到也不停」（扣款那两条）。
            #
            # 后两条是**代扣那一刻的结果**，与协议那两条说的不是一件事：
            # 协议 active 而某一期没扣成是完全正常的组合。
            #
            # 队列名里的 order.paid 是历史（它今天同时装 order.paid 与两条协议事件）。
            # 队列名一旦声明就不能改，改了等于换一个新队列，旧队列上原有的绑定
            # 还留在 broker 里继续收消息，那些消息再也没人 ack。要改名先手工删旧队列。
            - name: RABBITMQ_QUEUE
              value: membership.order.paid.dev
            - name: RABBITMQ_ROUTING_KEY
              value: "order.paid,payment.agreement.signed,payment.agreement.terminated,payment.agreement.charge_succeeded,payment.agreement.charge_failed"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: panda-secret
                  key: JWT_SECRET
            - name: MERCHANT_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: panda-secret
                  key: MERCHANT_INTERNAL_TOKEN
            - name: DB_MIGRATE_ON_START
              value: "false"
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 400m
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: membership-service
  namespace: pandaaaa
spec:
  selector:
    app: membership-service
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: grpc
      port: 9090
      targetPort: grpc
