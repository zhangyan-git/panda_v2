# 咖啡机与设备域：厂商、机型、设备、设备上的饮品。
# 挂载点位前要问商户域「这个点位存不存在」，设备的读接口还要问用户域拿账号身份。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coffee-machine-service
  namespace: pandaaaa
  labels:
    app.kubernetes.io/name: coffee-machine-service
    app.kubernetes.io/part-of: panda-v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: coffee-machine-service
  template:
    metadata:
      labels:
        app: coffee-machine-service
        app.kubernetes.io/version: "bb2c1d7"
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: coffee-machine-service
          image: 192.168.18.75:30500/pandaaaa/coffee-machine-service:bb2c1d7d1f7a426ec3ec84eaf08a10c13a3e4143
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 9090
          envFrom:
            - configMapRef:
                name: panda-common
          env:
            # 链路里的 service.version。**取的是 Pod 标签，不是写死的字符串** ——
            # 写死的那个值和镜像 tag 是两个地方，迟早有一个过期，
            # 而过期的版本号比没有版本号更糟：它会让你相信链路看到的是对的。
            # 换版本时改上面的 image tag 和下面的 version 标签，两处都在这个文件里。
            - name: SERVICE_VERSION
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['app.kubernetes.io/version']
            - name: SERVICE_NAME
              value: coffee-machine-service
            - name: HTTP_ADDR
              value: ":8080"
            - name: GRPC_ADDR
              value: ":9090"
            - name: COFFEE_MACHINE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: panda-secret
                  key: COFFEE_MACHINE_DATABASE_URL
            # 两个都是 config 里必填的：少了直接拒绝启动，不是一个降级模式。
            - name: MERCHANT_GRPC_ADDR
              value: merchant-service:9090
            - name: USER_GRPC_ADDR
              value: user-service:9090
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: panda-secret
                  key: RABBITMQ_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: panda-secret
                  key: JWT_SECRET
            - name: MERCHANT_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: panda-secret
                  key: MERCHANT_INTERNAL_TOKEN
            # 刻意不设 REDIS_ADDR，与 merchant-service 同理。
            - name: DB_MIGRATE_ON_START
              value: "false"
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 400m
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: coffee-machine-service
  namespace: pandaaaa
spec:
  selector:
    app: coffee-machine-service
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: grpc
      port: 9090
      targetPort: grpc
