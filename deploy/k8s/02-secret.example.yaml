# Secret **模板** —— 全部是占位值，仓库里永远只有这一份。
#
# 真正的那份不落在仓库里，用下面这条命令从本机一份未纳入版本控制的文件创建
# （`--from-env-file` 的格式就是 .env，可以直接拿 deploy/config/.env 改一版）：
#
#   kubectl -n pandaaaa create secret generic panda-secret \
#     --from-env-file=/path/to/panda-secret.env \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# 也可以走 SealedSecret / External Secrets 之类的托管方案；手册 §3 只要求
# 「凭据不进仓库、不进 Issue、不进聊天」。
#
# 本文件里**不能**出现的：任何真实密码、Token、私钥、证书、kubeconfig、生产连接串。
#
# 键的取值口径（与 deploy/config/.env.example 一致）：
#   - *_DATABASE_URL 必须是指向集群内 postgres Service 的完整 URL；各服务只认自己那一个，
#     config.resolveDatabase 在变量为空时**拒绝启动**，不回落到共享默认库。
#     「回落到默认库」看起来更宽容，实际是让服务把自己的表建到别人的库里还不报错。
#   - PARTNER_SECRET_KEY 必须解出来正好 32 字节，否则 partner-service 拒绝启动。
#   - MERCHANT_INTERNAL_TOKEN 至少 32 字节。各服务之间用它互相认身份；
#     不钉死一个值（比如让每个服务各自兜底成不同的随机值）会让跨服务调用假 503。
apiVersion: v1
kind: Secret
metadata:
  name: panda-secret
  namespace: pandaaaa
type: Opaque
stringData:
  POSTGRES_PASSWORD: "replace-me"

  USER_DATABASE_URL: "postgres://panda:replace-me@postgres:5432/panda_identity?sslmode=disable"
  MERCHANT_DATABASE_URL: "postgres://panda:replace-me@postgres:5432/panda_merchant?sslmode=disable"
  COUPON_DATABASE_URL: "postgres://panda:replace-me@postgres:5432/panda_coupon?sslmode=disable"
  COFFEE_MACHINE_DATABASE_URL: "postgres://panda:replace-me@postgres:5432/panda_coffee_machine?sslmode=disable"
  ORDER_DATABASE_URL: "postgres://panda:replace-me@postgres:5432/panda_order?sslmode=disable"
  PAYMENT_DATABASE_URL: "postgres://panda:replace-me@postgres:5432/panda_payment?sslmode=disable"
  ACCOUNT_DATABASE_URL: "postgres://panda:replace-me@postgres:5432/panda_account?sslmode=disable"
  LOTTERY_DATABASE_URL: "postgres://panda:replace-me@postgres:5432/panda_lottery?sslmode=disable"
  MEMBERSHIP_DATABASE_URL: "postgres://panda:replace-me@postgres:5432/panda_membership?sslmode=disable"
  PARTNER_DATABASE_URL: "postgres://panda:replace-me@postgres:5432/panda_partner?sslmode=disable"

  RABBITMQ_URL: "amqp://panda:replace-me@rabbitmq:5672/"
  RABBITMQ_PASSWORD: "replace-me"
  REDIS_PASSWORD: ""

  JWT_SECRET: "replace-with-a-long-random-secret"
  MERCHANT_INTERNAL_TOKEN: "replace-with-at-least-32-byte-service-token"

  # partner-service 的封签名主密钥。占位值本身是**合格的**（base64 解出来正是
  # 32 字节的 dev-only-partner-master-key-32b! ），能真的封/解；上线前必须换掉。
  PARTNER_SECRET_KEY: "ZGV2LW9ubHktcGFydG5lci1tYXN0ZXIta2V5LTMyYiE="

  # --- 渠道参数 ---------------------------------------------------------------
  # 下面这一段**不是机密**，放这里是因为它们是按环境开通、按环境不同的值，
  # 而清单文件是要进仓库的：写死在 Deployment 里迟早会有一份对不上。
  # 放在同一个 Secret 里只为了「一次交付一份」，不是把它们当密码看。

  # H5 支付结束后的结果页回跳地址（用户看完会跳到这里）。
  PAYMENT_RETURN_PAGE_URL: ""

  # 银联商务（UMS）。
  #   BASE_URL / APP_ID / MID / TID / SOURCE_CODE / DOMAIN_NAME / SCENE_TYPE /
  #   MER_APP_NAME / MER_APP_ID —— 开通后由渠道给的商户与终端参数。
  # 注意 BASE_URL 是**渠道的生产或测试域名**，指向哪个就打通哪个环境，
  # 填之前先确认这批数据是要打到哪里 —— 本机 dev .env 里那一份指的是生产。
  PAYMENT_UMS_BASE_URL: ""
  PAYMENT_UMS_APP_ID: ""
  PAYMENT_UMS_MID: ""
  PAYMENT_UMS_TID: ""
  PAYMENT_UMS_SOURCE_CODE: ""
  PAYMENT_UMS_DOMAIN_NAME: ""
  PAYMENT_UMS_SCENE_TYPE: ""
  PAYMENT_UMS_MER_APP_NAME: ""
  PAYMENT_UMS_MER_APP_ID: ""
  # 这两个是**密钥**。APP_KEY 出站签名、COMM_KEY 入站验签，**两个不能混用**：
  # 拿 APP_KEY 去验回调会让所有回调整体被拒，看起来像渠道那边签名算错了。
  PAYMENT_UMS_APP_KEY: "replace-me"
  PAYMENT_UMS_COMM_KEY: "replace-me"

  # 微信支付。本轮未接通（没有证书），整段留空不影响其余四种支付方式。
  WECHAT_PAY_BASE_URL: ""
  WECHAT_PAY_APP_ID: ""
  WECHAT_PAY_MCH_ID: ""
  # 证书与私钥的**路径**。要真接通时得把证书挂进容器再填这里 ——
  # 两个都落在 Secret 里挂载的文件上，不要写进镜像。
  WECHAT_PAY_CERT_PATH: ""
  WECHAT_PAY_KEY_PATH: ""
  WECHAT_PAY_SIGN_MINI_PROGRAM_APP_ID: ""
  WECHAT_PAY_API_V2_KEY: "replace-me"
  # AppID 本身不算机密，但它和 Secret 是一对、只在这一个服务上用，
  # 放在一起比在 Deployment 里写一个看着像真配置的占位值更不容易被误读。
  WECHAT_MINIAPP_APP_ID: "replace-me"
  WECHAT_MINIAPP_APP_SECRET: "replace-me"

  OSS_ACCESS_KEY: "replace-me"
  OSS_SECRET_KEY: "replace-me"
  # 桶名。merchant-service 上传营业执照等到这里；OSS_ENDPOINT 不是机密，
  # 直接写在 Deployment 里。
  OSS_BUCKET: "replace-me"

  GRAFANA_ADMIN_PASSWORD: "replace-me"

  # 只给 `user-service/cmd/seed` 用（一次性 Job，见 README）。那个二进制自带
  # requireDevEnvironment()，PANDA_ENV 不是 dev 时直接退出，不会误在生产建号。
  DEV_ADMIN_PASSWORD: "replace-me"
  DEV_MERCHANT_PASSWORD: "replace-me"
