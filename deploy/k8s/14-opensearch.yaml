# OpenSearch：日志存储。日志链路是 服务 → OTLP → otel-collector → 本实例，
# Grafana 再从它读（datasources.yml 里的 opensearch 数据源）。
#
# 单节点 + 关闭安全插件，与 compose 栈一致。手册 §1 定位是开发测试集群，不加 TLS。
# 它**没有** Ingress，只在集群内可达。
apiVersion: v1
kind: Service
metadata:
  name: opensearch
  namespace: pandaaaa
spec:
  clusterIP: None
  selector:
    app: opensearch
  ports:
    - name: http
      port: 9200
      targetPort: http
    - name: perf
      port: 9600
      targetPort: perf
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: opensearch
  namespace: pandaaaa
spec:
  serviceName: opensearch
  replicas: 1
  selector:
    matchLabels:
      app: opensearch
  template:
    metadata:
      labels:
        app: opensearch
    spec:
      # fsync 在 local-path 上要走宿主机磁盘，多给一点等待时间。
      terminationGracePeriodSeconds: 60
      containers:
        - name: opensearch
          image: opensearchproject/opensearch:2.15.0
          ports:
            - name: http
              containerPort: 9200
            - name: perf
              containerPort: 9600
          env:
            - name: discovery.type
              value: single-node
            - name: DISABLE_SECURITY_PLUGIN
              value: "true"
            - name: DISABLE_INSTALL_DEMO_CONFIG
              value: "true"
            # compose 里是 512m；这里给到 1g。
            #
            # 理由不是「感觉不够」：这个实例要装下全部服务的日志，而 Grafana 那个
            # 「1 秒一桶查 24 小时」的面板在 512m 堆上很容易先 OOM 再谈查询。
            # 上限写在 resources.limits 里是 3Gi，1g 堆 + 堆外足够。
            # 改这里要和 limits 一起改：堆不能超过 limit，否则 Pod 直接 OOMKilled。
            - name: OPENSEARCH_JAVA_OPTS
              value: "-Xms1g -Xmx1g"
          volumeMounts:
            - name: data
              mountPath: /usr/share/opensearch/data
          # 启动慢是正常的（JVM + 分片恢复），所以 initialDelay 给足、失败次数给宽。
          readinessProbe:
            httpGet:
              path: /_cluster/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /_cluster/health
              port: http
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 3Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 30Gi
