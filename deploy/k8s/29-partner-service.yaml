# 开放平台（合作方接入）：合作方账号与密钥、调用日志、三条开放接口。
# 三条开放接口各挂一个下游：会员权益查会员域，两条设备回调转订单域。
#
# 合作方从**公网**经网关打进来，所以这个服务的来源 IP 判断要往后端看一层
# ——见下面的 PARTNER_TRUSTED_PROXY_CIDRS。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: partner-service
  namespace: pandaaaa
  labels:
    app.kubernetes.io/name: partner-service
    app.kubernetes.io/part-of: panda-v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: partner-service
  template:
    metadata:
      labels:
        app: partner-service
        app.kubernetes.io/version: "ae557f0"
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: partner-service
          image: 192.168.18.75:30500/pandaaaa/partner-service:ae557f024e9dc815df77f5183d5bd0db1f2c9be9
          ports:
            - name: http
              containerPort: 8080
            # 入向 gRPC 今天**没有注册任何 RPC**（本服务没有自己的 proto），
            # 但服务端令牌校验挂在它上面 —— 口子即便空着也留在这里，
            # 让将来加 RPC 的人不需要先想起来「还要开一个监听」。
            - name: grpc
              containerPort: 9090
          envFrom:
            - configMapRef:
                name: panda-common
          env:
            # 链路里的 service.version。**取的是 Pod 标签，不是写死的字符串** ——
            # 写死的那个值和镜像 tag 是两个地方，迟早有一个过期，
            # 而过期的版本号比没有版本号更糟：它会让你相信链路看到的是对的。
            # 换版本时改上面的 image tag 和下面的 version 标签，两处都在这个文件里。
            - name: SERVICE_VERSION
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['app.kubernetes.io/version']
            - name: SERVICE_NAME
              value: partner-service
            - name: HTTP_ADDR
              value: ":8080"
            - name: GRPC_ADDR
              value: ":9090"
            - name: PARTNER_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: panda-secret
                  key: PARTNER_DATABASE_URL
            # 后台每条路由要现取一次授权（partner:read / partner:manage），
            # 问不到就 fail-closed。必填，缺了容器起不来。
            - name: USER_GRPC_ADDR
              value: user-service:9090
            # 两条设备回调的转发目标（刷卡回执与取货码），经订单域落单。
            - name: ORDER_GRPC_ADDR
              value: order-service:9090
            # 会员权益那一条开放接口的转发目标。
            - name: MEMBERSHIP_GRPC_ADDR
              value: membership-service:9090
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: panda-secret
                  key: RABBITMQ_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: panda-secret
                  key: JWT_SECRET
            - name: MERCHANT_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: panda-secret
                  key: MERCHANT_INTERNAL_TOKEN
            # 封签名主密钥。必须解出来正好 32 字节，否则拒绝启动。
            - name: PARTNER_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: panda-secret
                  key: PARTNER_SECRET_KEY

            # **这一行不能省、也不能留空。** 合作方从公网经网关进来，
            # 不看 X-Forwarded-For 的话每个请求的来源都是入口自己的地址，
            # 于是「配了 IP 白名单的合作方全部 401 + IP_NOT_ALLOWED」——
            # 失败关闭是对的，但它看上去像对方填错了 IP。
            #
            # 取值必须是**入口组件所在的网段**：本集群里 Traefik 也是一个 Pod，
            # 所以 10.42.0.0/16（k3s 默认 pod CIDR）是对的。
            # **待维护方确认**：若集群改过 cluster-cidr，这里要跟着改。
            - name: PARTNER_TRUSTED_PROXY_CIDRS
              value: "10.42.0.0/16"

            # **这一行与别的服务相反，必须显式写。** 即使 .env 里 REDIS_ADDR 是空的，
            # 本服务的 nonce 去重是失败关闭的硬要求：没有一个真 Redis 时
            # NewNonceStore 让进程直接**拒绝启动**。那是刻意的 ——
            # 一个静默跳过去重的进程比一个起不来的进程危险得多。
            - name: REDIS_ADDR
              value: redis:6379
            # 本部署的 Redis 没有密码（集群内可达、无 Ingress）。显式传一个空值，
            # 而不是靠「变量没设」—— 那两种写法在代码里走的是同一条路，
            # 但只有一种能在清单上读出来。
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: panda-secret
                  key: REDIS_PASSWORD
            - name: DB_MIGRATE_ON_START
              value: "false"
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 400m
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: partner-service
  namespace: pandaaaa
spec:
  selector:
    app: partner-service
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: grpc
      port: 9090
      targetPort: grpc
