syntax = "proto3";

package panda.account.v1;

option go_package = "github.com/panda-dev/panda-v2/contracts/proto/account/v1";

enum AccountType {
  ACCOUNT_TYPE_UNSPECIFIED = 0;
  ACCOUNT_TYPE_ADMIN = 1;
  ACCOUNT_TYPE_MERCHANT = 2;
}

enum AccountStatus {
  ACCOUNT_STATUS_UNSPECIFIED = 0;
  ACCOUNT_STATUS_ACTIVE = 1;
  ACCOUNT_STATUS_DISABLED = 2;
}

message LoginRequest {
  string username = 1;
  string password = 2;
  AccountType type = 3;
}

message LoginResponse {
  string access_token = 1;
  string refresh_token = 2;
  string token_type = 3;
  int64 expires_in = 4;
  Account account = 5;
}

message Account {
  string account_id = 1;
  string username = 2;
  AccountType type = 3;
  string user_id = 4;
  AccountStatus status = 5;
}

service AccountService {
  rpc Login(LoginRequest) returns (LoginResponse);
}
