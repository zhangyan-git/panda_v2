version: v2
# Generated bindings are committed so that `go build ./...` works without buf or
# protoc installed. CI re-runs this and fails on any diff, which is what keeps
# them honest. `clean` is deliberately off: it would delete the hand-written
# README.md files that sit next to the protos.
#
# out is proto/ because paths=source_relative is relative to the buf module root
# (proto), and every go_package is .../contracts/proto/<domain>/v1 — generating
# into the source tree is what makes those import paths resolve.
plugins:
  - local: protoc-gen-go
    out: proto
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: proto
    opt: paths=source_relative
