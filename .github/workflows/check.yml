name: checks
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      # Report every module's result rather than stopping at the first failure.
      fail-fast: false
      matrix:
        # A nested go.mod is a separate module: `go test ./...` inside backend
        # skips it entirely. Without an entry here these services are never
        # built or tested at all, which is how they drifted out of CI before.
        #
        # Each entry also names the database its integration tests read. Those
        # tests skip themselves when the variable is unset, so until this job
        # provisioned anything they were not "passing" — they were not running,
        # and the green tick said nothing about the code they cover. Every entry
        # that has DB-gated tests carries database_env/database/migration_set;
        # the ones without say so instead of silently pointing at nothing.
        include:
          - module: backend
            # The platform tests are connection-level (pool limits, pgx
            # behaviour) plus the migration runner's own tests, which create and
            # drop tables as they go. Two separate scratch databases, so neither
            # can see the other's leftovers.
            database_env: TEST_DATABASE_URL
            database: panda_platform_test
            scratch_env: ACCOUNT_TEST_DATABASE_URL
            scratch_database: panda_platform_scratch
          - module: backend/services/user-service
            database_env: USER_DATABASE_URL
            database: panda_identity
            migration_set: identity
          - module: backend/services/merchant-service
            database_env: MERCHANT_DATABASE_URL
            database: panda_merchant
            migration_set: merchant
          - module: backend/services/coupon-service
            database_env: COUPON_DATABASE_URL
            database: panda_coupon
            migration_set: coupon
          - module: backend/services/coffee-machine-service
            database_env: COFFEE_MACHINE_DATABASE_URL
            database: panda_coffee_machine
            migration_set: coffee_machine
          - module: backend/services/order-service
            database_env: ORDER_DATABASE_URL
            database: panda_order
            migration_set: order
          - module: backend/services/payment-service
            database_env: PAYMENT_DATABASE_URL
            database: panda_payment
            migration_set: payment
          - module: backend/services/account-service
            database_env: ACCOUNT_DATABASE_URL
            database: panda_account
            migration_set: account
          - module: backend/services/lottery-service
            database_env: LOTTERY_DATABASE_URL
            database: panda_lottery
            migration_set: lottery
          - module: backend/services/gateway-service
            # No database of its own and no DB-gated tests: the gateway routes
            # and does not store.
          # Both were added after this list was written and neither is reachable
          # from another entry: `go test ./...` in backend/ stops at their nested
          # go.mod. That is the same way the services above drifted out before.
          - module: backend/services/membership-service
            database_env: MEMBERSHIP_DATABASE_URL
            database: panda_membership
            migration_set: membership
          - module: backend/services/partner-service
            # Stores its keys and call logs, but has no DB-gated tests yet.
          # The migration sets are their own module too, and they are what every
          # other module's schema assumes: a syntax error here surfaces as a
          # failed deploy, not a failed build, unless it is checked here.
          - module: migrations
    defaults:
      run:
        # Block style on purpose: `${{ ... }}` inside a flow mapping makes the
        # outer braces ambiguous to a strict YAML parser.
        working-directory: ${{ matrix.module }}
    services:
      # Four real backends, because the tests below are the ones that exist to
      # catch what a fake cannot: pool exhaustion against a real server, a
      # broker reconnect, a lease that outlives its holder.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: panda
          POSTGRES_PASSWORD: panda
          # Named explicitly: without it the image defaults the one database it
          # creates to POSTGRES_USER, and the psql below connects to `postgres`.
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U panda"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
      rabbitmq:
        image: rabbitmq:3.13
        env:
          # Not the image's default guest user: that one may only log in from
          # 127.0.0.1, and a connection arriving through a published port comes
          # from the bridge address instead.
          RABBITMQ_DEFAULT_USER: panda
          RABBITMQ_DEFAULT_PASS: panda
        ports: ['5672:5672']
        options: >-
          --health-cmd "rabbitmq-diagnostics -q check_running"
          --health-interval 10s --health-timeout 10s --health-retries 20
      etcd:
        # The upstream image rather than a repackager's: its tag names have not
        # been retired out from under a workflow.
        image: quay.io/coreos/etcd:v3.5.16
        env:
          ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
          ETCD_ADVERTISE_CLIENT_URLS: http://127.0.0.1:2379
        ports: ['2379:2379']
        # Deliberately no --health-cmd, unlike the three above.
        #
        # This image is built from scratch: it contains the etcd and etcdctl
        # binaries and nothing else — no /bin/sh. `docker create --health-cmd`
        # has no exec form, it always becomes ["CMD-SHELL", …], so every probe
        # died with `exec: "/bin/sh": stat /bin/sh: no such file or directory`
        # and the container never reached healthy. That did not fail the etcd
        # tests: it failed the job at "Initialize containers", before checkout,
        # for all twelve matrix entries at once.
        #
        # Readiness is waited for explicitly in a step below instead — from the
        # runner side, over the published port, where the HTTP endpoint is
        # enough and no shell inside the image is involved.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.25'}
      # Every database starts empty and gets its module's migration set applied
      # before any test runs: the fixtures assume the schema exists, they never
      # create it (no test file in this repository runs a migration).
      - name: Create the test databases
        run: |
          set -euo pipefail
          psql "postgres://panda:panda@localhost:5432/postgres?sslmode=disable" -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE panda_platform_test" \
            -c "CREATE DATABASE panda_platform_scratch" \
            -c "CREATE DATABASE panda_identity" \
            -c "CREATE DATABASE panda_merchant" \
            -c "CREATE DATABASE panda_coupon" \
            -c "CREATE DATABASE panda_coffee_machine" \
            -c "CREATE DATABASE panda_order" \
            -c "CREATE DATABASE panda_payment" \
            -c "CREATE DATABASE panda_account" \
            -c "CREATE DATABASE panda_lottery" \
            -c "CREATE DATABASE panda_membership"
      # The other three services block the job until they report healthy; etcd
      # cannot (see the note on its service above), so it is waited for here.
      # Without this the first etcd call in a test would race the container's
      # ~1s startup and fail as a connection refused, which reads like a broken
      # registry rather than a container that had not finished booting.
      - name: Wait for etcd
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl -sf http://127.0.0.1:2379/health >/dev/null; then
              echo "etcd is ready after ${attempt}s"
              exit 0
            fi
            sleep 1
          done
          echo "etcd never became ready; last response:"
          curl -sv http://127.0.0.1:2379/health || true
          exit 1
      - name: Apply this module's migrations
        if: matrix.migration_set != ''
        run: |
          go run ./cmd/panda-migrate -database \
            "postgres://panda:panda@localhost:5432/${{ matrix.database }}?sslmode=disable" \
            apply "${{ matrix.migration_set }}"
        # This step is the one exception to the matrix's working directory: the
        # runner lives in the migrations module, which is where the sets are
        # embedded.
        working-directory: migrations
      - name: Point the integration tests at their database
        if: matrix.database_env != ''
        run: |
          set -euo pipefail
          base="postgres://panda:panda@localhost:5432"
          # Every variable this step exports, space separated, for the guard below.
          names="${{ matrix.database_env }}"
          {
            echo "${{ matrix.database_env }}=$base/${{ matrix.database }}?sslmode=disable"
            # TEST_DATABASE_URL as well, always pointing at the same database: it is
            # the fallback name every helper in this repository accepts, and two
            # user-service suites read **only** it (internal/repository/role_test.go
            # and internal/casbin/enforcer_test.go). Exporting just the module's own
            # name left those seven tests skipping behind a green tick.
            if [ "${{ matrix.database_env }}" != "TEST_DATABASE_URL" ]; then
              echo "TEST_DATABASE_URL=$base/${{ matrix.database }}?sslmode=disable"
              names="$names TEST_DATABASE_URL"
            fi
            if [ -n "${{ matrix.scratch_env }}" ]; then
              echo "${{ matrix.scratch_env }}=$base/${{ matrix.scratch_database }}?sslmode=disable"
              names="$names ${{ matrix.scratch_env }}"
            fi
            # Only the platform module's tests reach for these; the services
            # talk to them through fakes.
            if [ "${{ matrix.module }}" = "backend" ]; then
              echo "REDIS_TEST_ADDR=127.0.0.1:6379"
              echo "TEST_RABBITMQ_URL=amqp://panda:panda@127.0.0.1:5672/"
              echo "TEST_ETCD_ENDPOINT=127.0.0.1:2379"
            fi
          } >> "$GITHUB_ENV"
          echo "PANDA_TEST_DB_VARS=$names" >> "$GITHUB_ENV"
      # The failure this guards against is silent: rename or drop the variable a
      # fixture reads and `go test` reports the same tidy green, because the
      # tests skip themselves. Nothing else in this job would notice — the seven
      # user-service suites that read only TEST_DATABASE_URL were doing exactly
      # that until this was checked one name at a time.
      - name: This module really reads the variables we set
        if: matrix.database_env != ''
        run: |
          set -euo pipefail
          for name in $PANDA_TEST_DB_VARS; do
            if ! grep -rq "os.Getenv(\"$name\")" --include='*_test.go' .; then
              echo "No test in ${{ matrix.module }} reads \$$name."
              echo "Either the integration tests were renamed (they are skipping silently) or this"
              echo "matrix entry is stale. Fix one of the two before merging."
              exit 1
            fi
          done
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt reported unformatted files:"
            echo "$unformatted"
            exit 1
          fi
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  # Generated protobuf bindings are committed so that a checkout builds without
  # buf or protoc installed. This job is what keeps them honest: it regenerates
  # and fails if the result differs from what is committed.
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.25'}
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: '1.72.0'
          # Without a token this action queries the GitHub API anonymously, which is
          # 60 requests per hour **per IP** — and the runner pool shares its IPs with
          # everyone else's jobs. It does not fail politely either: the whole job dies
          # in about nine seconds, before checkout's work is even reached, so it reads
          # like a broken workflow rather than a busy neighbour. Seen 2026-09-23: green
          # on one push, rate-limited on the next, same tree.
          github_token: ${{ secrets.GITHUB_TOKEN }}
      # Pin the plugins to the versions that produced the committed bindings; a
      # newer generator would rewrite them and fail this job for no good reason.
      - run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
      - run: buf generate
        working-directory: contracts
      - name: Fail on drift
        run: |
          # --porcelain rather than `git diff`: a newly added proto produces an
          # untracked binding, which a plain diff would not report.
          if [ -n "$(git status --porcelain -- contracts)" ]; then
            git status --porcelain -- contracts
            echo "Generated bindings are stale. Run 'cd contracts && buf generate' and commit the result."
            exit 1
          fi
      - name: Build and test the contracts module
        run: |
          go build ./...
          go vet ./...
          go test ./...
        working-directory: contracts

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 两个 app 的 tsconfig.json 全文只有一行 extends ./src/.umi/tsconfig.json，而
      # src/.umi/ 是 umi 生成的临时目录，被 .gitignore 忽略——干净检出里它不存在，
      # tsc 于是拿不到任何 compilerOptions（TS5083），接着满屏都是它的连带症状：
      # "Cannot use JSX unless the '--jsx' flag is provided"、'@umijs/max' has no
      # exported member 'useModel'。生成它的 max dev / max build 排在 typecheck
      # **之后**，所以必须是独立的一步，不能指望后面的 build 顺手补上。
      # 必须写 `run setup`：pnpm 自己有一个内置的 `setup` 子命令（配置 pnpm 的家目录），
      # 裸写 `pnpm -r setup` 会被它吃掉并报 Unknown option: 'recursive'。
      - run: pnpm -r --filter ./admin-web --filter ./merchant-web run setup
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
